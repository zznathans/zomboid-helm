name: Docker

on:
  pull_request:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: false
          tags: zomboid-server:ci
          # Same scope as docker-publish.yml so a release reuses layers a
          # PR's build already warmed.
          cache-from: type=gha,scope=zomboid-server-image
          cache-to: type=gha,mode=max,scope=zomboid-server-image
