# Default values for zomboid-server.

# -- Number of replicas. Project Zomboid does not support clustering/HA,
# leave this at 1. It exists as a value only so it's visible/documented.
replicaCount: 1

image:
  # -- Defaults to the image published by this repo's docker-publish.yml
  # workflow (ghcr.io/zznathans/zomboid-server). Override if you're using
  # your own fork/build of the server image.
  repository: ghcr.io/zznathans/zomboid-server
  pullPolicy: IfNotPresent
  # -- Defaults to the chart's appVersion if unset.
  tag: ""

imagePullSecrets: []
# -- Chart.yaml's name is "zomboid-server-chart" (the "-chart" suffix keeps
# the published OCI chart artifact from colliding with the server image in
# GHCR), so this pins the app/label name back to "zomboid-server".
nameOverride: "zomboid-server"
fullnameOverride: ""

# -- Deployment update strategy. Recreate is required (not RollingUpdate)
# because the data volume is ReadWriteOnce and can only be mounted by one
# pod at a time.
strategy:
  type: Recreate

podAnnotations: {}
podLabels: {}

# -- Pod-level security context. Some PZ images run as root by default;
# adjust runAsUser/runAsGroup/fsGroup to match your image if it drops
# privileges.
podSecurityContext:
  fsGroup: 1000
  # runAsUser: 1000
  # runAsGroup: 1000

# -- Container-level security context.
securityContext: {}
  # allowPrivilegeEscalation: false

# -- Non-secret environment variables passed straight through to the
# container. Adjust keys to match what your image actually expects.
env:
  SERVER_NAME: "MyZomboidServer"
  # SERVER_PASSWORD: ""
  # MODS: ""
  # WORKSHOP_ITEMS: ""

# -- Escape hatch for env vars not covered by `env`, using the full
# Kubernetes env entry syntax (e.g. valueFrom).
extraEnv: []
  # - name: SOME_VAR
  #   value: "some-value"

# -- Sensitive env vars (admin/RCON passwords etc.) sourced from a Secret
# instead of plaintext values. Set secrets.create=true to have the chart
# create the Secret from `secrets.data`, or set existingSecret to the name
# of a Secret you manage yourself with the same keys.
secrets:
  create: true
  # existingSecret: ""
  # -- Keys become env var names in the container when secrets.create=true.
  data:
    ADMIN_PASSWORD: "changeme"
    RCON_PASSWORD: "changeme"

service:
  # -- LoadBalancer works out of the box on k3s via its built-in ServiceLB.
  # Switch to NodePort if you don't have a LoadBalancer implementation.
  #
  # -- For clusters with no cloud/on-prem LoadBalancer implementation (e.g. a
  # bare-metal homelab cluster), set type: NodePort and pin a `nodePort` value
  # per port below so the port stays stable across upgrades/reinstalls. Then
  # configure your router to forward the real, well-known external port
  # (e.g. 16261/UDP) to `<node-ip>:<pinned-nodePort>` -- port translation
  # happens at the router, not in-cluster.
  #
  # -- Kubernetes only allows nodePort values inside the cluster's configured
  # `--service-node-port-range` (default 30000-32767 on most clusters,
  # including unconfigured RKE-style clusters). Project Zomboid's real ports
  # (16261, 16262, 27015) fall below that range, so they can't be used
  # directly as nodePort values unless a cluster admin has expanded the
  # apiserver's port range (a cluster-level change, out of scope for this
  # chart). Pick a free port inside the valid range instead (e.g. 31261) and
  # forward the real port to it at the router.
  type: LoadBalancer
  ports:
    game:
      enabled: true
      port: 16261
      protocol: UDP
      # -- Optional. Pins the NodePort Kubernetes allocates for this port
      # (only used when service.type is NodePort, or on a Service where
      # kube-apiserver still allocates one anyway). Leave empty ("") to let
      # Kubernetes pick a random port each time (current default behavior).
      # Must be within the cluster's --service-node-port-range.
      nodePort: ""
    steam:
      enabled: true
      port: 16262
      protocol: UDP
      # -- See game.nodePort above.
      nodePort: ""
    rcon:
      enabled: true
      port: 27015
      protocol: TCP
      # -- See game.nodePort above. Only relevant if you want remote RCON
      # access; most users should leave RCON unexposed outside the cluster.
      nodePort: ""

persistence:
  # -- Persist Zomboid save/config data across pod restarts.
  enabled: true
  # -- Path inside the container where PZ stores its data. Adjust to match
  # your image (commonly the user's ~/Zomboid directory).
  mountPath: /data
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  # -- Use an existing PVC instead of creating one.
  existingClaim: ""

# -- Optional server config file(s) to mount into the container, e.g.
# servertest.ini. Only rendered if this is non-empty. Key = filename,
# value = file content.
config: {}
  # servertest.ini: |
  #   PVP=false
  #   Open=true

# -- Where to mount the rendered config files, if `config` is set.
configMountPath: /config

resources: {}
  # Project Zomboid is CPU/RAM hungry, especially with mods; size these to
  # your server population and modlist.
  # requests:
  #   cpu: 2000m
  #   memory: 4Gi
  # limits:
  #   memory: 8Gi

podDisruptionBudget:
  # -- Blocks voluntary eviction of the game server pod (node drains,
  # autoscaler downscale, etc). Since this is a single-replica game
  # server, any eviction disconnects every player -- leave this on
  # unless you specifically need to allow node maintenance to proceed.
  enabled: true
  # -- Set this OR maxUnavailable, not both. When set, maxUnavailable is
  # ignored.
  minAvailable: ""
  maxUnavailable: 0

nodeSelector: {}
tolerations: []
affinity: {}
